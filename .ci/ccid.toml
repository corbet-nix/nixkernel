# Shared ccid runner; coverage selectors are explicit.
schema = 1
project = "nixkernel"

[checks.native]
kind = "nix"
mode = "native"

[checks.eval]
kind = "nix"
mode = "eval"

[checks.list]
kind = "nix"
mode = "list"

[checks.all-systems]
kind = "nix"
mode = "all-systems"

# Pre-existing nix checks above preserved verbatim; Crow job wiring appended below.

[render]
render_schema = 2
[jobs.verify]
scheduler = "forgejo"
runs_on = "linux"
checks = ["native", "eval", "list"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]

# The multi-arch evaluation by hand (workflow_dispatch only, never a push or pull request): it needs far more memory
# than the per-push verify, so it runs on request and before a release instead.
[jobs.heavy]
scheduler = "forgejo"
runs_on = "linux"
checks = ["all-systems"]
workflow = "heavy"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]
