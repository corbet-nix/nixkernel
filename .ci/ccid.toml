# Shared ccid runner; coverage selectors are explicit.
schema = 1
project = "nixkernel"

[checks.native]
kind = "nix"
mode = "native"

[checks.eval]
kind = "nix"
mode = "eval"

[checks.list]
kind = "nix"
mode = "list"

[checks.all-systems]
kind = "nix"
mode = "all-systems"

# Pre-existing nix checks above preserved verbatim; Crow job wiring appended below.

[render]
tool_revision = "bd9aff07073185fb0a3503bab331aedefb6d8fd2"
tool_sha256 = "38c0eadf2a2adb406f83c7d4892bc01a0a10b95671e1e671358e43a257bb5d23"
[jobs.verify]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["native", "eval", "list", "all-systems"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]
