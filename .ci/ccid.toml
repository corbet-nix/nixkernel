# Shared ccid runner; coverage selectors are explicit.
schema = 1
project = "nixkernel"

[checks.native]
kind = "nix"
mode = "native"

[checks.eval]
kind = "nix"
mode = "eval"

[checks.list]
kind = "nix"
mode = "list"

[checks.all-systems]
kind = "nix"
mode = "all-systems"

# Pre-existing nix checks above preserved verbatim; Crow job wiring appended below.

[render]
render_schema = 2
[jobs.verify]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["native", "eval", "list", "all-systems"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]
